transformation_sprints:
  - id: T-001
    wave: 0
    status: DONE
    goal: Produce evidence-based current state audit and gap register
    why_now: Cannot plan execution without knowing what actually exists
    files:
      - docs/transformation-v4/00-CURRENT-STATE.md
      - docs/transformation-v4/01-GAP-REGISTER.yaml
      - docs/transformation-v4/13-SPRINT-BACKLOG.yaml
    expected_tests: 0
    acceptance_criteria:
      - All 20 gaps documented with priority and effort
      - Current state matrix reflects actual implementation
      - Sprint backlog covers T-001 through T-012
    effort_days: 1
    risk: LOW
    dependency: NONE

  - id: T-002
    wave: 5
    status: DONE
    goal: Workflow engine admin API with instance query and transition history
    why_now: Vertical slice is built but workflow state is not observable
    files:
      - src/commercial/workflow_engine/router.py
      - src/commercial/workflow_engine/engine.py
      - tests/commercial/test_sprint240_workflow_api.py
    expected_tests: 12
    acceptance_criteria:
      - GET /workflow/instances returns paginated list with filters
      - GET /workflow/stats returns numeric counts per state
      - GET /workflow/definitions returns built-in + custom definitions
    effort_days: 1
    risk: LOW
    dependency: NONE

  - id: T-003
    wave: 4
    status: OPEN
    goal: Add SLA tracking to work orders with breach detection
    why_now: Core operational KPI — SLA compliance cannot be measured without it
    files:
      - alembic/versions/NEW_sla_tracking.py
      - src/commercial/work_orders/models.py
      - src/commercial/work_orders/schemas.py
      - src/commercial/work_orders/repository.py
      - src/commercial/work_orders/router.py
      - tests/commercial/test_sprint_t003_sla.py
    expected_tests: 14
    acceptance_criteria:
      - work_orders table has sla_hours + sla_breach_at columns
      - GET /work-orders/ response includes sla_status field
      - GET /work-orders/?sla_breached=true returns only breached orders
    effort_days: 2
    risk: MEDIUM
    dependency: T-001

  - id: T-004
    wave: 1
    status: OPEN
    goal: Security test suite covering tenant isolation and auth boundaries
    why_now: No automated proof that hotel A cannot access hotel B data
    files:
      - tests/security/test_tenant_isolation.py
      - tests/security/test_auth_boundary.py
      - tests/security/test_idor.py
    expected_tests: 20
    acceptance_criteria:
      - Test proves cross-tenant data access is blocked
      - Test proves unauthenticated access returns 401 on all routes
      - Test proves invalid hotel_id in JWT cannot bypass scope
    effort_days: 2
    risk: HIGH
    dependency: T-001

  - id: T-005
    wave: 2
    status: OPEN
    goal: Application service layer for Operations domain (SR + WO)
    why_now: Routers contain business logic — violates architecture boundary
    files:
      - src/commercial/service_requests/service.py
      - src/commercial/work_orders/service.py
      - tests/commercial/test_sprint_t005_services.py
    expected_tests: 12
    acceptance_criteria:
      - OperationsService class handles SR→WO business logic
      - Router delegates to service — no direct repository calls
      - Service is independently testable without HTTP layer
    effort_days: 3
    risk: MEDIUM
    dependency: T-003

  - id: T-006
    wave: 6
    status: OPEN
    goal: Event outbox foundation — platform_events table and dispatcher
    why_now: AI/Digital Twin/notifications need reliable async event feed
    files:
      - alembic/versions/NEW_platform_events.py
      - src/core/events.py
      - src/core/outbox.py
      - tests/commercial/test_sprint_t006_events.py
    expected_tests: 10
    acceptance_criteria:
      - platform_events table exists with hotel_id + event_type + payload
      - WO complete/close writes event to outbox
      - EventDispatcher reads outbox and delivers to consumers
    effort_days: 2
    risk: HIGH
    dependency: T-005

  - id: T-007
    wave: 6
    status: OPEN
    goal: Read models for executive dashboard — no direct OLTP queries
    why_now: Dashboard performance degrades as data grows
    files:
      - src/commercial/executive_dashboard/read_models.py
      - src/commercial/executive_dashboard/router.py
      - tests/commercial/test_sprint_t007_readmodels.py
    expected_tests: 10
    acceptance_criteria:
      - ExecutiveKPIReadModel computed from domain tables
      - Dashboard endpoint uses read model not raw OLTP
      - Read model refresh triggered by domain events
    effort_days: 2
    risk: MEDIUM
    dependency: T-006

  - id: T-008
    wave: 4
    status: OPEN
    goal: E2E test for complete SR→WO→close vertical slice via portal UI
    why_now: Spec-18 tests API — no UI-level flow verification exists
    files:
      - portal/e2e/19-vertical-slice-ui.spec.ts
    expected_tests: 8
    acceptance_criteria:
      - Playwright navigates to /operations/service-requests/new
      - Creates SR, generates WO, completes WO, closes WO via UI
      - Final state shows closed status in portal
    effort_days: 1
    risk: LOW
    dependency: T-002

  - id: T-009
    wave: 7
    status: OPEN
    goal: Organization_id migration plan and compatibility layer
    why_now: hotel_id-only model blocks SaaS scale — multi-company impossible
    files:
      - alembic/versions/NEW_org_id_compat.py
      - src/core/tenant.py
      - docs/transformation-v4/ADR-001-TENANCY.md
      - tests/commercial/test_sprint_t009_tenancy.py
    expected_tests: 10
    acceptance_criteria:
      - organization_id column added with hotel_id as alias
      - get_hotel_id() returns org-scoped value transparently
      - ADR documents migration strategy and rollback plan
    effort_days: 3
    risk: HIGH
    dependency: T-004

  - id: T-010
    wave: 8
    status: OPEN
    goal: AI Gateway foundation — single governed entry point for all AI calls
    why_now: AI calls scattered in routers with no cost tracking or audit
    files:
      - src/commercial/ai_gateway/__init__.py
      - src/commercial/ai_gateway/gateway.py
      - src/commercial/ai_gateway/router.py
      - tests/commercial/test_sprint_t010_ai_gateway.py
    expected_tests: 10
    acceptance_criteria:
      - All AI requests go through AIGateway.request()
      - Every request logged to platform_audit_log with cost field
      - Gateway enforces tenant context on every call
    effort_days: 3
    risk: MEDIUM
    dependency: T-006

  - id: T-011
    wave: 9
    status: OPEN
    goal: Digital Twin event projection for assets and work orders
    why_now: graph/page.tsx is a placeholder — no real twin data exists
    files:
      - src/commercial/digital_twin/projector.py
      - src/commercial/digital_twin/router.py
      - tests/commercial/test_sprint_t011_digital_twin.py
    expected_tests: 8
    acceptance_criteria:
      - Asset events project into twin_nodes table
      - WO events create twin_edges between asset and technician
      - GET /digital-twin/asset/{id}/impact returns linked entities
    effort_days: 3
    risk: HIGH
    dependency: T-006

  - id: T-012
    wave: 12
    status: OPEN
    goal: Commercial demo tenant with 30 days of realistic seed data
    why_now: Cannot demonstrate platform to customers without real-looking data
    files:
      - scripts/seed_demo_tenant.py
      - scripts/seed_data/assets.json
      - scripts/seed_data/work_orders.json
      - scripts/seed_data/suppliers.json
      - docs/DEMO-GUIDE.md
    expected_tests: 5
    acceptance_criteria:
      - Demo hotel has 50 assets, 200 work orders, 20 suppliers
      - seed_demo_tenant.py runs cleanly from fresh DB
      - Executive dashboard shows meaningful KPIs on demo data
    effort_days: 2
    risk: LOW
    dependency: T-009
