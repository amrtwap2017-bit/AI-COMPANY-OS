networks:
  tb-network:
    driver: bridge
services:
  tb-backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: tb-backend
    depends_on:
      tb-redis:
        condition: service_healthy
    env_file:
    - .env
    environment:
    - DATABASE_URL=postgresql+psycopg2://ai:ai123@host.docker.internal:5432/triangle_black
    - TRIANGLE_BLACK_DB_URL=postgresql+psycopg2://ai:ai123@host.docker.internal:5432/triangle_black
    - POSTGRES_URL=postgresql+psycopg2://ai:ai123@host.docker.internal:5432/triangle_black
    - AI_ENGINE_URL=http://host.docker.internal:11434/api/generate
    - ENVIRONMENT=production
    - REDIS_URL=redis://tb-redis:6379/0
    - ENABLE_TENANT_RATE_LIMIT=1
    - TENANT_RATE_LIMIT_MAX=500
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 20s
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8030/api/v1/health
      timeout: 10s
    networks:
    - tb-network
    ports:
    - 8030:8030
    restart: unless-stopped
    volumes:
    - ./src:/app/src:ro
    - ./uploads:/app/uploads
  tb-portal:
    build:
      context: ./portal
      dockerfile: Dockerfile.portal
    container_name: tb-portal
    depends_on:
      tb-backend:
        condition: service_healthy
      tb-redis:
        condition: service_healthy
    environment:
    - NODE_ENV=production
    networks:
    - tb-network
    ports:
    - 3000:3000
    restart: unless-stopped
  tb-redis:
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    container_name: tb-redis
    healthcheck:
      interval: 10s
      retries: 3
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 5s
    image: redis:7-alpine
    networks:
    - tb-network
    ports:
    - 6379:6379
    restart: unless-stopped
    volumes:
    - tb_redis_data:/data
version: '3.9'
volumes:
  tb_redis_data:
    driver: local
