# Triangle Black — Production
# Usage: docker compose -f infra/compose/base.yml -f infra/compose/production.yml up -d
# Requires: .env.production with all required vars

version: "3.9"

services:
  # ── API ──────────────────────────────────────────────────
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TB_SECRET_KEY=${TB_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=production
      - DISABLE_RATE_LIMIT=0
      - ENABLE_TENANT_RATE_LIMIT=1
      - CORS_ORIGINS=${CORS_ORIGINS}
      - AI_ENGINE_URL=${AI_ENGINE_URL}
      - LOG_FORMAT=json
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8030/api/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # NO public port exposure — nginx proxies to this
    expose:
      - "8030"

  # ── Database ─────────────────────────────────────────────
  db:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # No port exposure in production — internal only
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Redis ────────────────────────────────────────────────
  redis:
    restart: unless-stopped
    # No port exposure in production — internal only
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx ────────────────────────────────────────────────
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_certs:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nginx_certs:
  nginx_logs:
