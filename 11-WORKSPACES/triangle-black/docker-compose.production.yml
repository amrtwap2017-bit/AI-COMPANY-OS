services:
  api:
    build: .
    depends_on:
    - redis
    - db
    env_file: .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TB_SECRET_KEY: ${TB_SECRET_KEY}
    ports:
    - 8030:8030
  db:
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - pg_isready
      timeout: 5s
    image: postgres:15
    volumes:
    - pgdata:/var/lib/postgresql/data
  redis:
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 5s
    image: redis:7-alpine
    volumes:
    - tb_redis_data:/data
version: '3.9'
volumes:
  pgdata:
    driver: local
  tb_redis_data:
    driver: local
