version: "3.9"

services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: tb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       triangle_black
      POSTGRES_USER:     ai
      POSTGRES_PASSWORD: ai123
    volumes:
      - tb_postgres_data:/var/lib/postgresql/data
    networks:
      - tb-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d triangle_black"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: tb-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-tb_redis_secret}
    volumes:
      - tb_redis_data:/data
    networks:
      - tb-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-tb_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: tb-api
    restart: unless-stopped
    environment:
      TRIANGLE_BLACK_DB_URL: postgresql+psycopg2://ai:ai123@postgres:5432/triangle_black
      JWT_SECRET:            ${JWT_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD:-tb_redis_secret}@redis:6379/0
      ENABLE_TENANT_RATE_LIMIT: ${ENABLE_TENANT_RATE_LIMIT:-1}
      TENANT_RATE_LIMIT_MAX: ${TENANT_RATE_LIMIT_MAX:-500}
      SMTP_ENABLED:          ${SMTP_ENABLED:-false}
      SMTP_HOST:             ${SMTP_HOST:-}
      SMTP_PORT:             ${SMTP_PORT:-587}
      SMTP_USER:             ${SMTP_USER:-}
      SMTP_PASSWORD:         ${SMTP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tb-net
    expose:
      - "8020"

  ops-portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    container_name: tb-ops-portal
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost/api/v1}
    networks:
      - tb-net
    expose:
      - "3200"

  client-portal:
    build:
      context: ./client-portal
      dockerfile: Dockerfile
    container_name: tb-client-portal
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost/api/v1}
    networks:
      - tb-net
    expose:
      - "3201"

  nginx:
    image: nginx:alpine
    container_name: tb-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - ops-portal
      - client-portal
    networks:
      - tb-net

volumes:
  tb_redis_data:
  tb_postgres_data:

networks:
  tb-net:
    driver: bridge
