openapi: 3.0.3
info:
  title: Triangle Black Hospitality Engineering Operating System — API
  version: 1.0.0
  description: |
    OpenAPI specification for the Triangle Black Hospitality Engineering Operating System.
    Covers all business domains: CRM, Project Delivery, Procurement, Supplier Management,
    Inventory, Financial Control, Maintenance, Document Management, Executive Intelligence,
    AI Copilots, Integrations, Mobile, and Human Resources.
  contact:
    name: Triangle Black Engineering
    url: https://triangleblack.com
  license:
    name: Proprietary

servers:
  - url: https://api.triangleblack.com/api/v1
    description: Production server
  - url: https://staging-api.triangleblack.com/api/v1
    description: Staging server
  - url: http://localhost:4000/api/v1
    description: Local development

paths:
  # ---- SEARCH ----
  /search:
    get:
      tags: [Search]
      summary: Full-text search across all domains
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [leads, opportunities, projects, quotations, inventory, documents, employees]
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                properties:
                  query:
                    type: string
                  results:
                    type: array
                    items:
                      properties:
                        type:
                          type: string
                        id:
                          type: string
                        title:
                          type: string
                        snippet:
                          type: string
                        score:
                          type: number
                        url:
                          type: string
                  total:
                    type: integer
                  page:
                    type: integer
                  per_page:
                    type: integer
                  facets:
                    type: object
  # ---- SHARED KERNEL ----
  /master-data/currencies:
    get:
      tags: [Master Data]
      summary: List currencies
      operationId: listCurrencies
      responses:
        '200':
          description: List of currencies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Currency'

  /master-data/currencies/{code}:
    put:
      tags: [Master Data]
      summary: Update currency exchange rate
      operationId: updateCurrencyRate
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rate: { type: number, description: Exchange rate against base currency }
              required: [rate]
      responses:
        '200':
          description: Currency updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Currency'

  /master-data/uom:
    get:
      tags: [Master Data]
      summary: List units of measure
      operationId: listUom
      responses:
        '200':
          description: List of UOM
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UnitOfMeasure'

  /master-data/tax-rates:
    get:
      tags: [Master Data]
      summary: List tax rates
      operationId: listTaxRates
      responses:
        '200':
          description: List of tax rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxRate'

  /master-data/countries:
    get:
      tags: [Master Data]
      summary: List countries
      operationId: listCountries
      responses:
        '200':
          description: List of countries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'

  /notifications:
    get:
      tags: [Notifications]
      summary: List user notifications
      operationId: listNotifications
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated notifications list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Get unread notification count
      operationId: unreadNotificationCount
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark notification as read
      operationId: markNotificationRead
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Notification marked as read

  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all notifications as read
      operationId: markAllNotificationsRead
      responses:
        '200':
          description: All notifications marked as read

  /audit:
    get:
      tags: [Audit]
      summary: Query audit log
      operationId: queryAuditLog
      parameters:
        - name: actor_id
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string }
        - name: resource_type
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /audit/{entityType}/{entityId}:
    get:
      tags: [Audit]
      summary: Get entity audit trail
      operationId: getEntityAuditTrail
      parameters:
        - name: entityType
          in: path
          required: true
          schema: { type: string }
        - name: entityId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Entity audit trail
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEntry'

  /system/health:
    get:
      tags: [System]
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: healthy }
                  timestamp:
                    type: string
                    format: date-time
                  uptime: { type: number }
                  database: { type: string, example: connected }

  /system/info:
    get:
      tags: [System]
      summary: Get system information
      operationId: getSystemInfo
      responses:
        '200':
          description: System information
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  environment: { type: string }
                  build: { type: string }

  # ---- CRM ----
  /crm/leads:
    post:
      tags: [CRM - Leads]
      summary: Create lead
      operationId: createLead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeadDto'
      responses:
        '201':
          description: Lead created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [CRM - Leads]
      summary: List leads (paginated, filterable)
      operationId: listLeads
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: status
          in: query
          schema:
            type: string
            enum: [new, contacted, qualified, disqualified, converted]
        - name: search
          in: query
          schema: { type: string }
        - name: source
          in: query
          schema:
            type: string
            enum: [website, referral, event, cold_outreach, other]
      responses:
        '200':
          description: Paginated leads list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Lead'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /crm/leads/stats:
    get:
      tags: [CRM - Leads]
      summary: Get lead pipeline statistics
      operationId: getLeadStats
      responses:
        '200':
          description: Lead pipeline stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  by_status:
                    type: object
                    additionalProperties: { type: integer }
                  conversion_rate: { type: number }

  /crm/leads/{id}:
    get:
      tags: [CRM - Leads]
      summary: Get lead with timeline
      operationId: getLead
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Lead detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [CRM - Leads]
      summary: Update lead
      operationId: updateLead
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                companyName: { type: string }
                status:
                  type: string
                  enum: [new, contacted, qualified, disqualified, converted]
                notes: { type: string }
      responses:
        '200':
          description: Lead updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
    delete:
      tags: [CRM - Leads]
      summary: Soft delete lead
      operationId: deleteLead
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Lead soft-deleted

  /crm/leads/{id}/convert:
    post:
      tags: [CRM - Leads]
      summary: Convert lead to opportunity
      operationId: convertLead
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                opportunityName: { type: string }
                estimatedValue: { type: number }
      responses:
        '200':
          description: Lead converted to opportunity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'

  /crm/leads/bulk/assign:
    post:
      tags: [CRM - Leads]
      summary: Bulk assign leads to user
      operationId: bulkAssignLeads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                leadIds:
                  type: array
                  items: { type: string, format: uuid }
                assignedTo: { type: string, format: uuid }
              required: [leadIds, assignedTo]
      responses:
        '200':
          description: Leads assigned

  /crm/opportunities:
    post:
      tags: [CRM - Opportunities]
      summary: Create opportunity
      operationId: createOpportunity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOpportunityDto'
      responses:
        '201':
          description: Opportunity created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
    get:
      tags: [CRM - Opportunities]
      summary: List opportunities (pipeline view)
      operationId: listOpportunities
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: stage
          in: query
          schema:
            type: string
            enum: [prospecting, qualification, proposal, negotiation, closed_won, closed_lost]
        - name: companyId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Paginated opportunities list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Opportunity'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /crm/opportunities/forecast:
    get:
      tags: [CRM - Opportunities]
      summary: Get pipeline forecast
      operationId: getOpportunityForecast
      responses:
        '200':
          description: Pipeline forecast
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_weighted: { type: number }
                  by_stage:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        count: { type: integer }
                        value: { type: number }
                        weighted: { type: number }

  /crm/opportunities/win-loss:
    get:
      tags: [CRM - Opportunities]
      summary: Win/loss analysis
      operationId: getWinLossAnalysis
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Win/loss analysis
          content:
            application/json:
              schema:
                type: object
                properties:
                  win_rate: { type: number }
                  total_won: { type: integer }
                  total_lost: { type: integer }
                  total_value_won: { type: number }
                  total_value_lost: { type: number }
                  reasons:
                    type: array
                    items:
                      type: object
                      properties:
                        reason: { type: string }
                        count: { type: integer }

  /crm/opportunities/{id}:
    get:
      tags: [CRM - Opportunities]
      summary: Get opportunity with relations
      operationId: getOpportunity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Opportunity detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
    patch:
      tags: [CRM - Opportunities]
      summary: Update opportunity stage/value
      operationId: updateOpportunity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                stage:
                  type: string
                  enum: [prospecting, qualification, proposal, negotiation, closed_won, closed_lost]
                estimatedValue: { type: number }
                probability: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '200':
          description: Opportunity updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
    delete:
      tags: [CRM - Opportunities]
      summary: Soft delete opportunity
      operationId: deleteOpportunity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Opportunity soft-deleted

  /crm/companies:
    post:
      tags: [CRM - Companies]
      summary: Create company
      operationId: createCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                region: { type: string }
                type:
                  type: string
                  enum: [hotel, resort, restaurant, facility_management, other]
              required: [name]
      responses:
        '201':
          description: Company created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
    get:
      tags: [CRM - Companies]
      summary: List companies
      operationId: listCompanies
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: region
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Paginated companies list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Company'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /crm/companies/{id}:
    get:
      tags: [CRM - Companies]
      summary: Get company with contacts and opportunities
      operationId: getCompany
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Company detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
    patch:
      tags: [CRM - Companies]
      summary: Update company
      operationId: updateCompany
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                region: { type: string }
      responses:
        '200':
          description: Company updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
    delete:
      tags: [CRM - Companies]
      summary: Soft delete company
      operationId: deleteCompany
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Company soft-deleted

  # ---- SURVEYS ----
  /surveys:
    post:
      tags: [Site Surveys]
      summary: Create / schedule site survey
      operationId: createSurvey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                leadId: { type: string, format: uuid }
                scheduledDate: { type: string, format: date-time }
                location: { type: string }
                notes: { type: string }
              required: [leadId, scheduledDate]
      responses:
        '201':
          description: Survey created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Survey'
    get:
      tags: [Site Surveys]
      summary: List site surveys
      operationId: listSurveys
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: status
          in: query
          schema:
            type: string
            enum: [scheduled, in_progress, submitted, approved, rejected]
      responses:
        '200':
          description: Paginated surveys list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Survey'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /surveys/{id}:
    get:
      tags: [Site Surveys]
      summary: Get survey with findings
      operationId: getSurvey
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Survey detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Survey'
    patch:
      tags: [Site Surveys]
      summary: Update survey findings
      operationId: updateSurvey
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                findings: { type: string }
                recommendations: { type: string }
      responses:
        '200':
          description: Survey updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Survey'

  /surveys/{id}/submit:
    post:
      tags: [Site Surveys]
      summary: Submit survey for approval
      operationId: submitSurvey
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Survey submitted

  /surveys/{id}/approve:
    post:
      tags: [Site Surveys]
      summary: Approve survey
      operationId: approveSurvey
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Survey approved

  /surveys/{id}/reject:
    post:
      tags: [Site Surveys]
      summary: Reject survey
      operationId: rejectSurvey
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Survey rejected

  /surveys/{id}/photos:
    post:
      tags: [Site Surveys]
      summary: Upload survey photos
      operationId: uploadSurveyPhotos
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photos:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Photos uploaded

  # ---- QUOTATIONS ----
  /quotations:
    post:
      tags: [Quotations]
      summary: Create quotation from opportunity
      operationId: createQuotation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                opportunityId: { type: string, format: uuid }
                validUntil: { type: string, format: date }
                notes: { type: string }
                lineItems:
                  type: array
                  items:
                    $ref: '#/components/schemas/QuotationLineItem'
              required: [opportunityId, lineItems]
      responses:
        '201':
          description: Quotation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
    get:
      tags: [Quotations]
      summary: List quotations
      operationId: listQuotations
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, submitted, approved, rejected, sent, client_approved, client_rejected]
      responses:
        '200':
          description: Paginated quotations list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Quotation'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /quotations/{id}:
    get:
      tags: [Quotations]
      summary: Get quotation with line items
      operationId: getQuotation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Quotation detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
    patch:
      tags: [Quotations]
      summary: Update quotation (draft only)
      operationId: updateQuotation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
