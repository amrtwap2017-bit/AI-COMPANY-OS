components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token for authentication.

  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ValidationError:
      description: Validation error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          description: URI identifying the problem type
        title:
          type: string
          description: Short human-readable summary
        status:
          type: integer
          description: HTTP status code
        detail:
          type: string
          description: Human-readable explanation
        instance:
          type: string
          description: URI identifying the specific occurrence
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 42

    Currency:
      type: object
      properties:
        code: { type: string, example: EGP }
        name: { type: string, example: Egyptian Pound }
        symbol: { type: string, example: "E£" }
        rate: { type: number }

    UnitOfMeasure:
      type: object
      properties:
        code: { type: string, example: M2 }
        name: { type: string, example: Square Meter }
        category:
          type: string
          enum: [area, length, volume, weight, count, time]

    TaxRate:
      type: object
      properties:
        code: { type: string, example: VAT_14 }
        name: { type: string, example: VAT 14% }
        rate: { type: number, example: 0.14 }
        isDefault: { type: boolean }

    Country:
      type: object
      properties:
        code: { type: string, example: EG }
        name: { type: string, example: Egypt }
        phoneCode: { type: string, example: "+20" }
        currencyCode: { type: string, example: EGP }

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
        link: { type: string }

    AuditEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        oldValue: { type: object }
        newValue: { type: object }
        timestamp: { type: string, format: date-time }
        tenantId: { type: string, format: uuid }

    CreateLeadDto:
      type: object
      properties:
        firstName: { type: string, example: Ahmed }
        lastName: { type: string, example: Hassan }
        email: { type: string, format: email, example: ahmed@hotel.com }
        phone: { type: string, example: "+201234567890" }
        companyName: { type: string, example: Pyramids Resort }
        source:
          type: string
          enum: [website, referral, event, cold_outreach, other]
        notes: { type: string }
      required: [firstName, lastName, source]

    Lead:
      type: object
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        companyName: { type: string }
        source: { type: string }
        status:
          type: string
          enum: [new, contacted, qualified, disqualified, converted]
        notes: { type: string }
        assignedTo: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateOpportunityDto:
      type: object
      properties:
        name: { type: string }
        companyId: { type: string, format: uuid }
        leadId: { type: string, format: uuid }
        estimatedValue: { type: number }
        stage:
          type: string
          enum: [prospecting, qualification, proposal, negotiation, closed_won, closed_lost]
        probability: { type: integer, minimum: 0, maximum: 100 }
      required: [name]

    Opportunity:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        companyId: { type: string, format: uuid }
        leadId: { type: string, format: uuid }
        stage: { type: string }
        estimatedValue: { type: number }
        probability: { type: integer }
        expectedCloseDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Company:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        region: { type: string }
        type: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }

    Survey:
      type: object
      properties:
        id: { type: string, format: uuid }
        leadId: { type: string, format: uuid }
        scheduledDate: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        location: { type: string }
        findings: { type: string }
        recommendations: { type: string }
        status:
          type: string
          enum: [scheduled, in_progress, submitted, approved, rejected]
        photos:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }

    QuotationLineItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        description: { type: string }
        quantity: { type: number }
        unitPrice: { type: number }
        uom: { type: string }
        taxRate: { type: number }
        total: { type: number }

    Quotation:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        opportunityId: { type: string, format: uuid }
        status:
          type: string
          enum: [draft, submitted, approved, rejected, sent, client_approved, client_rejected]
        validUntil: { type: string, format: date }
        subtotal: { type: number }
        taxTotal: { type: number }
        grandTotal: { type: number }
        notes: { type: string }
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/QuotationLineItem'
        createdAt: { type: string, format: date-time }

    Contract:
      type: object
      properties:
        id: { type: string, format: uuid }
        quotationId: { type: string, format: uuid }
        title: { type: string }
        number: { type: string }
        status:
          type: string
          enum: [draft, signed, active, terminated]
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        value: { type: number }
        terms: { type: string }
        createdAt: { type: string, format: date-time }

    ContractVariation:
      type: object
      properties:
        id: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        description: { type: string }
        valueChange: { type: number }
        reason: { type: string }
        createdAt: { type: string, format: date-time }

    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        name: { type: string }
        number: { type: string }
        status:
          type: string
          enum: [planning, in_progress, on_hold, completed, cancelled]
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        managerId: { type: string, format: uuid }
        budget: { type: number }
        createdAt: { type: string, format: date-time }

    CreateMilestoneDto:
      type: object
      properties:
        name: { type: string }
        dueDate: { type: string, format: date }
        description: { type: string }
      required: [name, dueDate]

    Milestone:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        dueDate: { type: string, format: date }
        status:
          type: string
          enum: [pending, in_progress, completed]
        approvedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    DailyReport:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        date: { type: string, format: date }
        summary: { type: string }
        weather: { type: string }
        labourCount: { type: integer }
        notes: { type: string }
        createdAt: { type: string, format: date-time }

    NonConformanceReport:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        description: { type: string }
        severity:
          type: string
          enum: [minor, major, critical]
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
        location: { type: string }
        reportedBy: { type: string, format: uuid }
        resolution: { type: string }
        createdAt: { type: string, format: date-time }

    ProjectRisk:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        description: { type: string }
        category: { type: string }
        probability: { type: string }
        impact: { type: string }
        mitigationPlan: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }

    Handover:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, in_progress, completed]
        initiatedBy: { type: string, format: uuid }
        completedAt: { type: string, format: date-time }
        notes: { type: string }

    PurchaseRequisition:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        requestedBy: { type: string, format: uuid }
        status:
          type: string
          enum: [draft, submitted, approved, rejected, ordered]
        items:
          type: array
          items:
            type: object
            properties:
              description: { type: string }
              quantity: { type: number }
              uom: { type: string }
              estimatedUnitCost: { type: number }
              requiredDate: { type: string, format: date }
        notes: { type: string }
        createdAt: { type: string, format: date-time }

    PurchaseOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        requisitionId: { type: string, format: uuid }
        supplierId: { type: string, format: uuid }
        status:
          type: string
          enum: [draft, submitted, approved, sent, partially_received, fully_received, closed]
        items:
          type: array
          items:
            type: object
            properties:
              description: { type: string }
              quantity: { type: number }
              unitCost: { type: number }
