version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8030:8030"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://tb_staging:${POSTGRES_PASSWORD}@db:5432/triangle_black}
      - TB_SECRET_KEY=${TB_SECRET_KEY}
      - DISABLE_RATE_LIMIT=0
      - ENABLE_TENANT_RATE_LIMIT=1
      - TENANT_RATE_LIMIT_MAX=500
      - LOG_FORMAT=json
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8030

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: triangle_black
      POSTGRES_USER: ${POSTGRES_USER:-tb_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - staging_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  staging_pg_data:
