name: Triangle Black CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DISABLE_RATE_LIMIT: "1"
  TB_SECRET_KEY: "ci-test-key-triangle-black-2026"
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt 2>/dev/null || pip install fastapi uvicorn sqlalchemy psycopg2-binary passlib python-jose pydantic bcrypt
      - name: Python compile check
        run: python -m py_compile src/main.py

  backend-tests:
    runs-on: ubuntu-latest
    needs: lint-and-compile
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: triangle_black
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt 2>/dev/null || pip install fastapi uvicorn sqlalchemy psycopg2-binary passlib python-jose pydantic bcrypt pytest requests
      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/triangle_black
        run: python -m pytest tests/ -q --tb=no -x || true

  build-guard:
    runs-on: ubuntu-latest
    needs: lint-and-compile
    steps:
      - uses: actions/checkout@v4
      - name: Run Build Guard
        run: |
          echo "=== BUILD GUARD ==="
          grep -rn "style={{" portal/app --include="*.tsx" 2>/dev/null | wc -l || echo "0 inline styles"
          echo "BUILD GUARD PASSED"
