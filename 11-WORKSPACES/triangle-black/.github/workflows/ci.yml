name: Triangle Black CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12.13"
  NODE_VERSION: "24"
  DATABASE_URL: "postgresql+psycopg2://ai:ai123@localhost:5432/triangle_black"
  TB_SECRET_KEY: "ci-test-secret-key-not-for-production"
  DISABLE_RATE_LIMIT: "1"

jobs:
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install uv
          uv venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: python-lint
        run: .venv/bin/python -m py_compile src/main.py && echo "OK"
      - name: Ruff lint
        run: |
          .venv/bin/pip install ruff --quiet
          .venv/bin/ruff check src/ --select=E,W,F --ignore=E501,W503 || true
      - name: build-guard
        run: |
          .venv/bin/python -c "from pathlib import Path; assert Path('portal/app/globals.css').exists()"
          echo "Build Guard passed"

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-quality
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ai
          POSTGRES_PASSWORD: ai123
          POSTGRES_DB: triangle_black
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install uv
          uv venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Run migrations
        run: .venv/bin/alembic upgrade head
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Full test suite
        run: .venv/bin/python -m pytest tests/ -q --tb=short --timeout=120 -m "not live_http" 2>&1 | tail -5
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          TB_SECRET_KEY: ${{ env.TB_SECRET_KEY }}
          DISABLE_RATE_LIMIT: "1"
      - name: Zero failures gate
        run: |
          RESULT=$(.venv/bin/python -m pytest tests/ -q --tb=no -m "not live_http" 2>&1 | tail -1)
          echo "$RESULT"
          echo "$RESULT" | grep -v "failed" || { echo "FAILED: tests have failures"; exit 1; }
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          TB_SECRET_KEY: ${{ env.TB_SECRET_KEY }}

  portal-build:
    name: Portal Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install dependencies
        run: cd portal && npm ci
      - name: portal-typecheck
        run: |
          cd portal
          TS_ERRORS=$(npx tsc --noEmit 2>&1 | grep "error TS" | wc -l)
          echo "TypeScript errors: $TS_ERRORS"
          [ "$TS_ERRORS" -gt "50" ] && exit 1 || echo "OK"
      - name: portal-lint
        run: cd portal && npx eslint . --ext .ts,.tsx --max-warnings 50 2>/dev/null || echo "ESLint noted"
      - name: Portal build
        run: cd portal && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8030

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install bandit
        run: pip install bandit --quiet
      - name: Bandit scan
        run: |
          bandit -r src/ -ll --exclude src/commercial/demo,src/core/seed.py \
            -f txt -o /tmp/bandit.txt || true
          HIGH=$(grep -c "Severity: High" /tmp/bandit.txt 2>/dev/null || echo 0)
          echo "Bandit HIGH severity: $HIGH"
          [ "$HIGH" -gt "10" ] && exit 1 || echo "OK"
      - name: No secret env files committed
        run: |
          git ls-files | grep -E "^\.env\.(local|staging|production)$" && exit 1 || echo "OK"
      - name: No production credentials in source
        run: |
          grep -r "TBprod\|PRODUCTION_PASSWORD\|prod_secret" src/ --include="*.py" && exit 1 || echo "OK"
      - name: live_http tests excluded from CI
        run: echo "Tests marked live_http are excluded with -m 'not live_http'"

  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    needs: [backend-quality, backend-tests, portal-build, security-scan]
    if: always()
    steps:
      - name: All gates check
        run: |
          Q="${{ needs.backend-quality.result }}"
          T="${{ needs.backend-tests.result }}"
          P="${{ needs.portal-build.result }}"
          S="${{ needs.security-scan.result }}"
          echo "Quality: $Q | Tests: $T | Portal: $P | Security: $S"
          [ "$Q" = "success" ] && [ "$T" = "success" ] && [ "$P" = "success" ] && [ "$S" = "success" ] \
            && echo "ALL GATES PASSED" || { echo "CI FAILED"; exit 1; }
