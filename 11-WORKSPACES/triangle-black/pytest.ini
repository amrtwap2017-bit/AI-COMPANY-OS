[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short --ignore=tests/commercial --ignore=tests/test_orchestrator --ignore=tests/test_invoices.py
asyncio_mode = strict
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestConfigWarning
env =
    DISABLE_RATE_LIMIT=1
