[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short --ignore=tests/test_orchestrator --ignore=tests/test_invoices.py --ignore=tests/test_live_api.py
asyncio_mode = strict
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestConfigWarning
