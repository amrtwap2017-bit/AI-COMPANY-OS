events {
    worker_connections 1024;
}

http {
    upstream api {
        server api:8020;
    }

    upstream ops_portal {
        server ops-portal:3200;
    }

    upstream client_portal {
        server client-portal:3201;
    }

    # Ops Portal — main domain
    server {
        listen 80;
        server_name app.triangleblack.com localhost;

        # API proxy
        location /api/ {
            proxy_pass         http://api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # Health check
        location /health {
            proxy_pass http://api;
        }

        # Ops portal
        location / {
            proxy_pass         http://ops_portal;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }

    # Client Portal — subdomain
    server {
        listen 80;
        server_name client.triangleblack.com;

        location /api/ {
            proxy_pass         http://api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass         http://client_portal;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}
