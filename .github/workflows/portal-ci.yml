name: Portal CI

on:
  push:
    branches: [main]
    paths:
      - "11-WORKSPACES/triangle-black/portal/**"
      - "11-WORKSPACES/triangle-black/src/**"
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: 11-WORKSPACES/triangle-black/portal

jobs:
  portal-build:
    name: Portal Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: 11-WORKSPACES/triangle-black/portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build portal
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8030
          NEXT_PUBLIC_AI_ENGINE_URL: http://localhost:8001
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_AUTH_BYPASS: "false"
          NEXT_PUBLIC_APP_NAME: Triangle Black
          API_URL: http://localhost:8030

  backend-syntax:
    name: Backend Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: |
          cd 11-WORKSPACES/triangle-black
          find src/ -name "*.py" -exec python3 -m py_compile {} \;
